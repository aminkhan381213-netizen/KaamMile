<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaamMile - नौकरी खोजें</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  color:#222;
}

header{
  background:#1565c0;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  font-size:28px;
}

header p{
  margin-top:5px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 2px 8px #0001;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  border:0;
  padding:12px 18px;
  border-radius:8px;
  background:#1565c0;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin:4px;
}

button:hover{
  opacity:.9;
}

.red{
  background:#d32f2f;
}

.green{
  background:#2e7d32;
}

.gray{
  background:#555;
}

nav{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:center;
  background:white;
  padding:10px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 5px #0002;
}

nav button{
  font-size:14px;
  padding:10px;
}

.hidden{
  display:none!important;
}

.job-title{
  color:#1565c0;
  font-size:21px;
  font-weight:bold;
}

.salary{
  color:#2e7d32;
  font-weight:bold;
  margin-top:8px;
}

.location{
  color:#555;
  margin-top:5px;
}

.small{
  color:#666;
  font-size:14px;
}

#message{
  text-align:center;
  padding:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>💼 KaamMile</h1>
  <p>अपने लिए नौकरी खोजें और आवेदन करें</p>
</header>

<div id="message"></div>

<!-- AUTH -->
<section id="authSection" class="container">

  <div class="card">
    <h2>🔐 KaamMile Login</h2>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <hr style="margin:15px 0">

    <h3>नया अकाउंट बनाएँ</h3>

    <input id="registerName" type="text" placeholder="आपका नाम">
    <input id="registerMobile" type="tel" placeholder="मोबाइल नंबर">
    <input id="registerEmail" type="email" placeholder="Email">
    <input id="registerPassword" type="password" placeholder="Password">

    <button class="green" onclick="registerUser()">Register</button>
  </div>

</section>


<!-- APP -->
<section id="appSection" class="hidden">

<nav>
  <button onclick="showPage('jobsPage')">🔎 Jobs</button>
  <button onclick="showPage('applicationsPage')">📋 मेरे आवेदन</button>
  <button onclick="showPage('addJobPage')">➕ Job जोड़ें</button>
  <button class="red" onclick="logout()">Logout</button>
</nav>


<!-- JOBS -->
<div id="jobsPage" class="container">

  <div class="card">
    <h2>🔎 Jobs खोजें</h2>

    <input
      id="searchInput"
      type="text"
      placeholder="Job, शहर या कंपनी खोजें..."
      oninput="searchJobs()"
    >
  </div>

  <div id="jobsList">
    <div class="card">Jobs लोड हो रही हैं...</div>
  </div>

</div>


<!-- APPLICATIONS -->
<div id="applicationsPage" class="container hidden">

  <div class="card">
    <h2>📋 मेरे Applications</h2>
  </div>

  <div id="applicationsList">
    <div class="card">Applications लोड हो रहे हैं...</div>
  </div>

</div>


<!-- ADD JOB -->
<div id="addJobPage" class="container hidden">

  <div class="card">

    <h2>➕ Job जोड़ें</h2>

    <input id="jobTitle" placeholder="Job का नाम">

    <input id="companyName" placeholder="Company का नाम">

    <input id="jobLocation" placeholder="Location / शहर">

    <input id="jobSalary" placeholder="Salary जैसे ₹12,000 - ₹18,000">

    <textarea
      id="jobDescription"
      rows="5"
      placeholder="Job की पूरी जानकारी"
    ></textarea>

    <button class="green" onclick="addJob()">
      Job Publish करें
    </button>

  </div>

</div>


<!-- APPLY -->
<div id="applyPage" class="container hidden">

  <div class="card">

    <h2>📝 Job के लिए Apply करें</h2>

    <h3 id="applyJobTitle"></h3>

    <input id="applyName" placeholder="आपका नाम">

    <input id="applyMobile" type="tel" placeholder="मोबाइल नंबर">

    <input id="applyEmail" type="email" placeholder="Email">

    <button class="green" onclick="submitApplication()">
      आवेदन भेजें
    </button>

    <button class="gray" onclick="showPage('jobsPage')">
      वापस जाएँ
    </button>

  </div>

</div>

</section>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  orderBy,
  serverTimestamp,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBVDRf48Ae6RC_zksyovEVTevC0rZtV0i0",

  authDomain:
  "kaammile-21752.firebaseapp.com",

  projectId:
  "kaammile-21752",

  storageBucket:
  "kaammile-21752.firebasestorage.app",

  messagingSenderId:
  "671205500858",

  appId:
  "1:671205500858:web:3e0acd748619b30af6df83",

  measurementId:
  "G-WKNWK425RB"
};


/* =========================
   INITIALIZE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;

let allJobs = [];

let selectedJob = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text, error=false){

  const box =
  document.getElementById("message");

  box.innerText = text;

  box.style.color =
  error ? "#d32f2f" : "#2e7d32";

  setTimeout(()=>{
    box.innerText="";
  },4000);
}


/* =========================
   REGISTER
========================= */

window.registerUser = async function(){

  const name =
  document.getElementById("registerName").value.trim();

  const mobile =
  document.getElementById("registerMobile").value.trim();

  const email =
  document.getElementById("registerEmail").value.trim();

  const password =
  document.getElementById("registerPassword").value;


  if(!name || !mobile || !email || !password){

    showMessage(
      "कृपया सभी जानकारी भरें",
      true
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Password कम से कम 6 characters का होना चाहिए",
      true
    );

    return;
  }


  try{

    const result =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    await addDoc(
      collection(db,"Users"),
      {
        uid:result.user.uid,
        name:name,
        mobile:mobile,
        email:email,
        createdAt:serverTimestamp()
      }
    );


    showMessage(
      "Account सफलतापूर्वक बन गया 🎉"
    );

  }

  catch(error){

    showMessage(
      error.message,
      true
    );

  }

};


/* =========================
   LOGIN
========================= */

window.login = async function(){

  const email =
  document.getElementById("loginEmail").value.trim();

  const password =
  document.getElementById("loginPassword").value;


  if(!email || !password){

    showMessage(
      "Email और Password डालें",
      true
    );

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    showMessage("Login सफल हुआ ✅");

  }

  catch(error){

    showMessage(
      "Login नहीं हुआ: " + error.message,
      true
    );

  }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(user){

      currentUser = user;

      document
      .getElementById("authSection")
      .classList.add("hidden");

      document
      .getElementById("appSection")
      .classList.remove("hidden");

      await loadJobs();

    }

    else{

      currentUser=null;

      document
      .getElementById("authSection")
      .classList.remove("hidden");

      document
      .getElementById("appSection")
      .classList.add("hidden");

    }

  }
);


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

  await signOut(auth);

  showMessage("Logout हो गया");

};


/* =========================
   SHOW PAGE
========================= */

window.showPage = function(page){

  const pages=[
    "jobsPage",
    "applicationsPage",
    "addJobPage",
    "applyPage"
  ];


  pages.forEach(id=>{

    document
    .getElementById(id)
    .classList.add("hidden");

  });


  document
  .getElementById(page)
  .classList.remove("hidden");


  if(page==="jobsPage"){

    loadJobs();

  }


  if(page==="applicationsPage"){

    loadApplications();

  }

};


/* =========================
   ADD JOB
========================= */

window.addJob = async function(){

  const title =
  document.getElementById("jobTitle").value.trim();

  const company =
  document.getElementById("companyName").value.trim();

  const location =
  document.getElementById("jobLocation").value.trim();

  const salary =
  document.getElementById("jobSalary").value.trim();

  const description =
  document.getElementById("jobDescription").value.trim();


  if(
    !title ||
    !company ||
    !location ||
    !salary ||
    !description
  ){

    showMessage(
      "कृपया Job की सभी जानकारी भरें",
      true
    );

    return;
  }


  try{

    await addDoc(
      collection(db,"Jobs"),
      {

        title:title,

        company:company,

        location:location,

        salary:salary,

        description:description,

        postedBy:currentUser.uid,

        createdAt:serverTimestamp()

      }
    );


    showMessage(
      "Job सफलतापूर्वक Publish हो गई 🎉"
    );


    document
    .getElementById("jobTitle")
    .value="";

    document
    .getElementById("companyName")
    .value="";

    document
    .getElementById("jobLocation")
    .value="";

    document
    .getElementById("jobSalary")
    .value="";

    document
    .getElementById("jobDescription")
    .value="";


    await loadJobs();

    showPage("jobsPage");

  }

  catch(error){

    showMessage(
      "Job save नहीं हुई: "+error.message,
      true
    );

  }

};


/* =========================
   LOAD JOBS
========================= */

async function loadJobs(){

  const list =
  document.getElementById("jobsList");

  list.innerHTML =
  '<div class="card">Jobs लोड हो रही हैं...</div>';


  try{

    const q =
    query(
      collection(db,"Jobs"),
      orderBy("createdAt","desc")
    );


    const snapshot =
    await getDocs(q);


    allJobs=[];


    snapshot.forEach(docSnap=>{

      allJobs.push({

        id:docSnap.id,

        ...docSnap.data()

      });

    });


    displayJobs(allJobs);

  }

  catch(error){

    console.error(error);

    list.innerHTML=
    `
    <div class="card">
      <h3>Jobs लोड नहीं हो सकीं</h3>
      <p class="small">
      Firestore Database और Rules check करें।
      </p>
    </div>
    `;

  }

}


/* =========================
   DISPLAY JOBS
========================= */

function displayJobs(jobs){

  const list =
  document.getElementById("jobsList");


  if(jobs.length===0){

    list.innerHTML=
    `
    <div class="card">
      <h3>अभी कोई Job उपलब्ध नहीं है</h3>
      <p>सबसे पहले Job जोड़ें।</p>
    </div>
    `;

    return;
  }


  list.innerHTML="";


  jobs.forEach(job=>{

    const card =
    document.createElement("div");

    card.className="card";


    card.innerHTML=
    `
      <div class="job-title">
        ${escapeHTML(job.title)}
      </div>

      <p>
        🏢 ${escapeHTML(job.company)}
      </p>

      <p class="location">
        📍 ${escapeHTML(job.location)}
      </p>

      <p class="salary">
        💰 ${escapeHTML(job.salary)}
      </p>

      <p class="small">
        ${escapeHTML(job.description)}
      </p>

      <br>

      <button
        class="green"
        onclick="openApply('${job.id}')">
        📝 Apply करें
      </button>
    `;


    list.appendChild(card);

  });

}


/* =========================
   SEARCH
========================= */

window.searchJobs = function(){

  const text =
  document
  .getElementById("searchInput")
  .value
  .toLowerCase()
  .trim();


  if(!text){

    displayJobs(allJobs);

    return;

  }


  const filtered =
  allJobs.filter(job=>{

    return(

      (job.title || "")
      .toLowerCase()
      .includes(text)

      ||

      (job.company || "")
      .toLowerCase()
      .includes(text)

      ||

      (job.location || "")
      .toLowerCase()
      .includes(text)

    );

  });


  displayJobs(filtered);

};


/* =========================
   OPEN APPLY
========================= */

window.openApply = function(jobId){

  selectedJob =
  allJobs.find(
    job=>job.id===jobId
  );


  if(!selectedJob){

    showMessage(
      "Job नहीं मिली",
      true
    );

    return;

  }


  document
  .getElementById("applyJobTitle")
  .innerText =
  selectedJob.title;


  document
  .getElementById("applyEmail")
  .value =
  currentUser.email || "";


  showPage("applyPage");

};


/* =========================
   SUBMIT APPLICATION
========================= */

window.submitApplication = async function(){

  if(!selectedJob){

    showMessage(
      "पहले Job चुनें",
      true
    );

    return;

  }


  const name =
  document
  .getElementById("applyName")
  .value
  .trim();


  const mobile =
  document
  .getElementById("applyMobile")
  .value
  .trim();


  const email =
  document
  .getElementById("applyEmail")
  .value
  .trim();


  if(!name || !mobile || !email){

    showMessage(
      "सभी जानकारी भरें",
      true
    );

    return;

  }


  try{

    await addDoc(
      collection(db,"Applications"),
      {

        jobId:selectedJob.id,

        jobTitle:selectedJob.title,

        company:selectedJob.company,

        applicantUid:currentUser.uid,

        applicantName:name,

        applicantMobile:mobile,

        applicantEmail:email,

        status:"Applied",

        createdAt:serverTimestamp()

      }
    );


    showMessage(
      "आपका आवेदन भेज दिया गया 🎉"
    );


    showPage(
      "applicationsPage"
    );

  }

  catch(error){

    showMessage(
      "Application भेजने में समस्या: "+
      error.message,
      true
    );

  }

};


/* =========================
   LOAD APPLICATIONS
========================= */

async function loadApplications(){

  const list =
  document.getElementById(
    "applicationsList"
  );


  list.innerHTML=
  '<div class="card">Applications लोड हो रहे हैं...</div>';


  try{

    const q =
    query(
      collection(db,"Applications"),
      where(
        "applicantUid",
        "==",
        currentUser.uid
      )
    );


    const snapshot =
    await getDocs(q);


    if(snapshot.empty){

      list.innerHTML=
      `
      <div class="card">
        <h3>अभी कोई Application नहीं है</h3>
        <p>Job खोजकर Apply करें।</p>
      </div>
      `;

      return;

    }


    list.innerHTML="";


    snapshot.forEach(docSnap=>{

      const appData =
      docSnap.data();


      const card =
      document.createElement("div");

      card.className="card";


      card.innerHTML=
      `
        <h3>
          ${escapeHTML(appData.jobTitle)}
        </h3>

        <p>
          🏢 ${escapeHTML(appData.company)}
        </p>

        <p>
          👤 ${escapeHTML(appData.applicantName)}
        </p>

        <p>
          📱 ${escapeHTML(appData.applicantMobile)}
        </p>

        <p>
          📌 Status:
          <b>${escapeHTML(appData.status)}</b>
        </p>
      `;


      list.appendChild(card);

    });

  }

  catch(error){

    console.error(error);

    list.innerHTML=
    `
    <div class="card">
      Applications लोड नहीं हो सकीं।
    </div>
    `;

  }

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  if(value===undefined || value===null)
    return "";

  return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

</script>

</body>
</html>
