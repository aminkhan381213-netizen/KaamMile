<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KaamMile - नौकरी खोजें</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7fb;
 color:#222
}
header{
 background:#1565c0;
 color:white;
 padding:20px;
 text-align:center
}
header h1{margin:0;font-size:30px}
header p{margin:6px 0 0}
nav{
 display:flex;
 gap:7px;
 padding:10px;
 background:white;
 overflow:auto;
 position:sticky;
 top:0;
 z-index:5
}
nav button{
 border:0;
 padding:11px 14px;
 border-radius:20px;
 background:#e3f2fd;
 color:#1565c0;
 font-weight:bold;
 white-space:nowrap
}
.container{
 max-width:700px;
 margin:auto;
 padding:15px
}
.card{
 background:white;
 padding:16px;
 margin:12px 0;
 border-radius:14px;
 box-shadow:0 2px 8px #0002
}
input{
 width:100%;
 padding:13px;
 margin:6px 0;
 border:1px solid #ccc;
 border-radius:9px;
 font-size:15px
}
.btn{
 width:100%;
 padding:13px;
 margin-top:8px;
 border:0;
 border-radius:9px;
 background:#1565c0;
 color:white;
 font-size:16px;
 font-weight:bold
}
.green{background:#188038}
.red{background:#d93025}
.job{
 border:1px solid #ddd;
 border-radius:12px;
 padding:15px;
 margin:12px 0;
 background:#fff
}
.job h3{margin:0 0 8px}
.salary{color:#188038;font-weight:bold}
.badge{
 display:inline-block;
 padding:5px 9px;
 margin:3px;
 background:#e8f0fe;
 color:#174ea6;
 border-radius:20px;
 font-size:12px
}
.hide{display:none}
.msg{
 padding:10px;
 border-radius:9px;
 margin:10px 0
}
.ok{background:#e6f4ea;color:#137333}
.err{background:#fce8e6;color:#c5221f}
.center{text-align:center}
</style>
</head>

<body>

<header>
<h1>💼 KaamMile</h1>
<p>नौकरी खोजें • Job जोड़ें • Apply करें</p>
</header>

<nav>
<button onclick="page('jobs')">💼 Jobs</button>
<button onclick="page('add')">➕ Job जोड़ें</button>
<button onclick="page('apps')">📋 मेरे आवेदन</button>
<button onclick="page('account')">👤 Account</button>
</nav>

<div class="container">

<div id="msg"></div>

<!-- JOBS -->
<section id="jobs">
<div class="card">
<h2>🔎 नौकरी खोजें</h2>
<input id="search"
placeholder="Job, company या location खोजें..."
oninput="showJobs()">
</div>

<div id="jobList">
<p class="center">Jobs लोड हो रही हैं...</p>
</div>
</section>

<!-- ADD JOB -->
<section id="add" class="hide">
<div class="card">
<h2>➕ Job जोड़ें</h2>

<input id="jtitle" placeholder="Job का नाम">
<input id="jcompany" placeholder="Company / दुकान">
<input id="jlocation" placeholder="Location">
<input id="jsalary" placeholder="Salary">
<input id="jdesc" placeholder="Job की जानकारी">

<button class="btn" onclick="addJob()">
Job Publish करें
</button>
</div>
</section>

<!-- APPLICATIONS -->
<section id="apps" class="hide">
<div class="card">
<h2>📋 मेरे आवेदन</h2>
<div id="appList">
Login करके अपने आवेदन देखें।
</div>
</div>
</section>

<!-- ACCOUNT -->
<section id="account" class="hide">

<div id="loginBox" class="card">
<h2>🔐 Login / Register</h2>

<input id="email"
type="email"
placeholder="Email">

<input id="password"
type="password"
placeholder="Password (कम से कम 6 अक्षर)">

<button class="btn" onclick="login()">
Login
</button>

<button class="btn green" onclick="register()">
नया Account बनाएँ
</button>
</div>

<div id="userBox" class="card hide">
<h2>👤 Account</h2>
<p id="userEmail"></p>

<button class="btn red" onclick="logout()">
Logout
</button>
</div>

</section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyBVDRf48Ae6RC_zksyovEVTevC0rZtV0i0",
authDomain:"kaammile-21752.firebaseapp.com",
projectId:"kaammile-21752",
storageBucket:"kaammile-21752.firebasestorage.app",
messagingSenderId:"671205500858",
appId:"1:671205500858:web:3e0acd748619b30af6df83",
measurementId:"G-WKNWK425RB"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

let user=null;
let jobs=[];

function msg(text,error=false){
let x=document.getElementById("msg");
x.className="msg "+(error?"err":"ok");
x.innerText=text;

setTimeout(()=>{
x.className="";
x.innerText="";
},4000);
}

function page(name){

document.querySelectorAll("section").forEach(x=>{
x.classList.add("hide");
});

document.getElementById(name).classList.remove("hide");

if(name==="jobs")loadJobs();
if(name==="apps")loadApps();
if(name==="account")updateUser();

}

function updateUser(){

if(user){

document.getElementById("loginBox").classList.add("hide");
document.getElementById("userBox").classList.remove("hide");
document.getElementById("userEmail").innerText=
"Email: "+user.email;

}else{

document.getElementById("loginBox").classList.remove("hide");
document.getElementById("userBox").classList.add("hide");

}

}

async function register(){

let email=document.getElementById("email").value.trim();
let pass=document.getElementById("password").value;

if(!email || pass.length<6){
msg("Email और कम से कम 6 अक्षर का Password डालें।",true);
return;
}

try{

await auth.createUserWithEmailAndPassword(email,pass);

msg("Account बन गया! 🎉");
page("jobs");

}catch(e){

msg(e.message,true);

}

}

async function login(){

let email=document.getElementById("email").value.trim();
let pass=document.getElementById("password").value;

try{

await auth.signInWithEmailAndPassword(email,pass);

msg("Login सफल हुआ ✅");
page("jobs");

}catch(e){

msg("Login नहीं हुआ: "+e.message,true);

}

}

async function logout(){

await auth.signOut();

msg("Logout हो गया।");
page("jobs");

}

async function loadJobs(){

let box=document.getElementById("jobList");

box.innerHTML="<p class='center'>Jobs लोड हो रही हैं...</p>";

try{

let snap=await db.collection("Job").get();

jobs=[];

snap.forEach(doc=>{
jobs.push({
id:doc.id,
...doc.data()
});
});

showJobs();

}catch(e){

box.innerHTML=
"<div class='msg err'>Jobs लोड नहीं हुईं: "+
e.message+"</div>";

}

}

function showJobs(){

let q=document.getElementById("search").value.toLowerCase();

let list=jobs.filter(j=>{

let text=
(j.Job||"")+" "+
(j.company||"")+" "+
(j.location||"")+" "+
(j.salary||"");

return text.toLowerCase().includes(q);

});

let box=document.getElementById("jobList");

if(list.length===0){

box.innerHTML=
"<div class='card center'>😔 कोई Job नहीं मिली।</div>";

return;

}

box.innerHTML=list.map(j=>`

<div class="job">

<h3>💼 ${safe(j.Job||"Job")}</h3>

${j.company?
`<span class="badge">🏢 ${safe(j.company)}</span>`:""}

${j.location?
`<span class="badge">📍 ${safe(j.location)}</span>`:""}

<p class="salary">
💰 ${safe(j.salary||"Salary नहीं दी गई")}
</p>

${j.description?
`<p>${safe(j.description)}</p>`:""}

<button class="btn"
onclick="apply('${j.id}')">
📝 Apply करें
</button>

</div>

`).join("");

}

async function apply(id){

if(!user){

msg("पहले Login करें।",true);
page("account");
return;

}

let job=jobs.find(x=>x.id===id);

if(!job)return;

let name=prompt("अपना नाम लिखें:");

if(!name)return;

let mobile=prompt("10 अंकों का Mobile नंबर:");

if(!mobile || !/^[0-9]{10}$/.test(mobile)){

msg("सही 10 अंकों का Mobile नंबर डालें।",true);
return;

}

try{

await db.collection("Applications").add({

Job:job.Job||"Job",
JobId:id,
company:job.company||"",
location:job.location||"",
salary:job.salary||"",
name:name,
mobile:mobile,
status:"Application submitted",
applicantUid:user.uid,
createdat:firebase.firestore.FieldValue.serverTimestamp()

});

msg("Application सफलतापूर्वक भेज दिया गया! 🎉");

}catch(e){

msg("Application नहीं भेजा गया: "+e.message,true);

}

}

async function loadApps(){

let box=document.getElementById("appList");

if(!user){

box.innerHTML="पहले Login करें।";
return;

}

box.innerHTML="Applications लोड हो रहे हैं...";

try{

let snap=await db.collection("Applications")
.where("applicantUid","==",user.uid)
.get();

if(snap.empty){

box.innerHTML="अभी कोई application नहीं है।";
return;

}

let html="";

snap.forEach(doc=>{

let a=doc.data();

html+=`

<div class="job">

<h3>💼 ${safe(a.Job||"Job")}</h3>

<p>🏢 ${safe(a.company||"")}</p>

<p>📍 ${safe(a.location||"")}</p>

<p class="salary">💰 ${safe(a.salary||"")}</p>

<span class="badge">
📌 ${safe(a.status||"Submitted")}
</span>

</div>

`;

});

box.innerHTML=html;

}catch(e){

box.innerHTML=
"<div class='msg err'>Applications नहीं लोड हुए: "+
e.message+"</div>";

}

}

async function addJob(){

if(!user){

msg("Job जोड़ने के लिए Login करें।",true);
page("account");
return;

}

let title=document.getElementById("jtitle").value.trim();
let company=document.getElementById("jcompany").value.trim();
let location=document.getElementById("jlocation").value.trim();
let salary=document.getElementById("jsalary").value.trim();
let desc=document.getElementById("jdesc").value.trim();

if(!title||!company||!location||!salary){

msg("Job, Company, Location और Salary भरें।",true);
return;

}

try{

await db.collection("Job").add({

Job:title,
company:company,
location:location,
salary:salary,
description:desc,
createdBy:user.uid,
createdat:firebase.firestore.FieldValue.serverTimestamp()

});

msg("Job Publish हो गई! 🎉");

document.getElementById("jtitle").value="";
document.getElementById("jcompany").value="";
document.getElementById("jlocation").value="";
document.getElementById("jsalary").value="";
document.getElementById("jdesc").value="";

page("jobs");

}catch(e){

msg("Job नहीं जुड़ी: "+e.message,true);

}

}

function safe(x){

return String(x)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

auth.onAuthStateChanged(u=>{

user=u;
updateUser();

});

page("jobs");

</script>

</body>
</html>
