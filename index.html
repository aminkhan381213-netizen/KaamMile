<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KaamMile - Job App</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f8;
  color:#222;
}

.header{
  background:#1769e0;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.header h1{
  margin:0;
  font-size:34px;
}

.header p{
  margin:8px 0 0;
  font-size:17px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
}

input,select{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#1769e0;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.logout{
  background:#e53935;
}

.apply{
  background:#16a34a;
}

.applied{
  background:#777;
}

.job{
  border:1px solid #ddd;
  padding:15px;
  margin:12px 0;
  border-radius:12px;
}

.job h3{
  margin:0 0 8px;
  color:#1769e0;
}

.job p{
  margin:6px 0;
}

.hidden{
  display:none !important;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-top:10px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  <h1>KaamMile</h1>
  <p>अपने लिए नौकरी खोजें और आवेदन करें</p>
</div>


<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage" class="container">

  <div class="card">

    <h2>📱 मोबाइल नंबर से Login</h2>

    <p>
      आवेदन करने और अपने आवेदन देखने के लिए पहले Login करें।
    </p>

    <label>नाम</label>

    <input
      id="name"
      type="text"
      placeholder="अपना नाम लिखें"
    >

    <label>मोबाइल नंबर</label>

    <input
      id="mobile"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="जैसे: 9876543210"
    >

    <button id="loginButton" type="button">
      Login करें
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- =========================
     APP PAGE
========================= -->

<div id="appPage" class="container hidden">

  <div class="card">

    <h2>👋 स्वागत है!</h2>

    <p>
      नाम:
      <b id="showName"></b>
    </p>

    <p>
      मोबाइल नंबर:
      <b id="showMobile"></b>
    </p>

    <button id="jobsButton" type="button">
      🔎 Jobs खोजें
    </button>

    <button id="applicationsButton" type="button">
      📋 मेरे आवेदन
    </button>

    <button id="logoutButton" class="logout" type="button">
      Logout
    </button>

  </div>


  <!-- =========================
       JOBS PAGE
  ========================= -->

  <div id="jobsPage">

    <div class="card">

      <h2>🔎 नौकरी खोजें</h2>

      <input
        id="search"
        type="text"
        placeholder="Job का नाम खोजें..."
      >

      <select id="location">

        <option value="">सभी जगह</option>

        <option value="Balotra">
          Balotra
        </option>

        <option value="Jodhpur">
          Jodhpur
        </option>

        <option value="Jaipur">
          Jaipur
        </option>

      </select>

    </div>

    <div id="jobsList"></div>

  </div>


  <!-- =========================
       APPLICATIONS PAGE
  ========================= -->

  <div id="applicationsPage" class="hidden">

    <div class="card">

      <h2>📋 मेरे आवेदन</h2>

      <div id="applicationsList">

        <div class="empty">
          आवेदन लोड हो रहे हैं...
        </div>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  serverTimestamp
}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBVDRf48Ae6RC_zksyovEVTevC0rZV0i0",

  authDomain:
  "kaammile-21752.firebaseapp.com",

  projectId:
  "kaammile-21752",

  storageBucket:
  "kaammile-21752.firebasestorage.app",

  messagingSenderId:
  "671205500858",

  appId:
  "1:671205500858:web:3e0acd748619b30af6df83"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   JOBS
========================= */

const jobs = [

  {
    id:1,
    title:"Data Entry Operator",
    company:"KaamMile Jobs",
    location:"Jaipur",
    salary:"₹12,000 - ₹18,000",
    type:"Full Time"
  },

  {
    id:2,
    title:"Computer Operator",
    company:"Local Company",
    location:"Jodhpur",
    salary:"₹10,000 - ₹16,000",
    type:"Full Time"
  },

  {
    id:3,
    title:"Sales Executive",
    company:"KaamMile Business",
    location:"Balotra",
    salary:"₹12,000 - ₹20,000",
    type:"Full Time"
  },

  {
    id:4,
    title:"Customer Support",
    company:"KaamMile Support",
    location:"Jaipur",
    salary:"₹15,000 - ₹25,000",
    type:"Work From Home"
  },

  {
    id:5,
    title:"Office Assistant",
    company:"Local Business",
    location:"Balotra",
    salary:"₹9,000 - ₹14,000",
    type:"Full Time"
  }

];


/* =========================
   ELEMENTS
========================= */

const loginPage =
  document.getElementById("loginPage");

const appPage =
  document.getElementById("appPage");

const nameInput =
  document.getElementById("name");

const mobileInput =
  document.getElementById("mobile");

const showName =
  document.getElementById("showName");

const showMobile =
  document.getElementById("showMobile");

const jobsPage =
  document.getElementById("jobsPage");

const applicationsPage =
  document.getElementById("applicationsPage");

const jobsList =
  document.getElementById("jobsList");

const applicationsList =
  document.getElementById("applicationsList");

const searchInput =
  document.getElementById("search");

const locationInput =
  document.getElementById("location");


/* =========================
   LOGIN
========================= */

document
.getElementById("loginButton")
.addEventListener("click", function(){

  const name =
    nameInput.value.trim();

  const mobile =
    mobileInput.value.trim();


  if(name === ""){

    alert("कृपया अपना नाम लिखें।");

    nameInput.focus();

    return;
  }


  if(!/^[0-9]{10}$/.test(mobile)){

    alert(
      "कृपया सही 10 अंकों का मोबाइल नंबर डालें।"
    );

    mobileInput.focus();

    return;
  }


  localStorage.setItem(
    "kaamMileName",
    name
  );

  localStorage.setItem(
    "kaamMileMobile",
    mobile
  );


  openApp();

});


/* =========================
   OPEN APP
========================= */

function openApp(){

  const name =
    localStorage.getItem("kaamMileName");

  const mobile =
    localStorage.getItem("kaamMileMobile");


  if(!name || !mobile){

    return;
  }


  loginPage.classList.add("hidden");

  appPage.classList.remove("hidden");


  showName.innerText =
    name;

  showMobile.innerText =
    mobile;


  showJobs();

}


/* =========================
   LOAD JOBS
========================= */

function loadJobs(){

  const search =
    searchInput.value
    .trim()
    .toLowerCase();


  const location =
    locationInput.value;


  const filtered =
    jobs.filter(function(job){

      const searchMatch =
        job.title
        .toLowerCase()
        .includes(search)

        ||

        job.company
        .toLowerCase()
        .includes(search);


      const locationMatch =
        location === ""

        ||

        job.location === location;


      return searchMatch &&
             locationMatch;

    });


  if(filtered.length === 0){

    jobsList.innerHTML = `

      <div class="card empty">

        😔 कोई Job नहीं मिली।

      </div>

    `;

    return;
  }


  jobsList.innerHTML =
    filtered.map(function(job){

      return `

        <div class="card job">

          <h3>
            💼 ${job.title}
          </h3>

          <p>
            🏢 <b>Company:</b>
            ${job.company}
          </p>

          <p>
            📍 <b>Location:</b>
            ${job.location}
          </p>

          <p>
            💰 <b>Salary:</b>
            ${job.salary}
          </p>

          <p>
            ⏰ <b>Type:</b>
            ${job.type}
          </p>

          <button
            class="apply"
            type="button"
            data-job-id="${job.id}"
          >
            📝 Apply करें
          </button>

        </div>

      `;

    }).join("");


  document
  .querySelectorAll("[data-job-id]")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        const jobId =
          Number(
            button.getAttribute("data-job-id")
          );

        applyJob(jobId);

      }
    );

  });

}


/* =========================
   APPLY JOB
========================= */

async function applyJob(jobId){

  const name =
    localStorage.getItem("kaamMileName");

  const mobile =
    localStorage.getItem("kaamMileMobile");


  if(!name || !mobile){

    alert("पहले Login करें।");

    return;
  }


  const job =
    jobs.find(function(j){

      return j.id === jobId;

    });


  if(!job){

    alert("Job नहीं मिली।");

    return;
  }


  try{

    /* =========================
       DUPLICATE CHECK
    ========================= */

    const q =
      query(

        collection(
          db,
          "Applications"
        ),

        where(
          "mobile",
          "==",
          mobile
        ),

        where(
          "JobId",
          "==",
          String(job.id)
        )

      );


    const existing =
      await getDocs(q);


    if(!existing.empty){

      alert(
        "आप इस Job के लिए पहले ही आवेदन कर चुके हैं।"
      );

      return;

    }


    /* =========================
       SAVE APPLICATION
    ========================= */

    await addDoc(

      collection(
        db,
        "Applications"
      ),

      {

        Job:
          job.title,

        JobId:
          String(job.id),

        company:
          job.company,

        location:
          job.location,

        salary:
          job.salary,

        mobile:
          mobile,

        name:
          name,

        status:
          "Application submitted",

        createdat:
          serverTimestamp()

      }

    );


    alert(
      "आपका आवेदन सफलतापूर्वक सेव हो गया! 🎉"
    );


    showApplications();


  }

  catch(error){

    console.error(
      "Firebase Error:",
      error
    );


    alert(
      "आवेदन सेव नहीं हुआ। Firebase Rules जाँचें।"
    );

  }

}


/* =========================
   SHOW JOBS
========================= */

function showJobs(){

  jobsPage.classList.remove(
    "hidden"
  );

  applicationsPage.classList.add(
    "hidden"
  );

  loadJobs();

}


/* =========================
   SHOW APPLICATIONS
========================= */

async function showApplications(){

  jobsPage.classList.add(
    "hidden"
  );

  applicationsPage.classList.remove(
    "hidden"
  );


  const mobile =
    localStorage.getItem(
      "kaamMileMobile"
    );


  if(!mobile){

    applicationsList.innerHTML = `

      <div class="empty">

        पहले Login करें।

      </div>

    `;

    return;

  }


  applicationsList.innerHTML = `

    <div class="empty">

      ⏳ आवेदन लोड हो रहे हैं...

    </div>

  `;


  try{

    const q =
      query(

        collection(
          db,
          "Applications"
        ),

        where(
          "mobile",
          "==",
          mobile
        )

      );


    const snapshot =
      await getDocs(q);


    if(snapshot.empty){

      applicationsList.innerHTML = `

        <div class="empty">

          अभी आपने किसी Job के लिए आवेदन नहीं किया है।

        </div>

      `;

      return;

    }


    let html = "";


    snapshot.forEach(function(doc){

      const a =
        doc.data();


      html += `

        <div class="card job">

          <h3>
            💼 ${a.Job || "Job"}
          </h3>

          <p>
            🏢 <b>Company:</b>
            ${a.company || "जानकारी उपलब्ध नहीं"}
          </p>

          <p>
            📍 <b>Location:</b>
            ${a.location || "जानकारी उपलब्ध नहीं"}
          </p>

          <p>
            💰 <b>Salary:</b>
            ${a.salary || "जानकारी उपलब्ध नहीं"}
          </p>

          <p>
            📱 <b>Mobile:</b>
            ${a.mobile || ""}
          </p>

          <p>
            🟢 <b>
              ${a.status || "Application submitted"}
            </b>
          </p>

        </div>

      `;

    });


    applicationsList.innerHTML =
      html;

  }

  catch(error){

    console.error(
      "Applications Error:",
      error
    );


    applicationsList.innerHTML = `

      <div class="empty">

        ❌ आवेदन लोड नहीं हो पाए।

        <br><br>

        Firebase Rules जाँचें।

      </div>

    `;

  }

}


/* =========================
   BUTTONS
========================= */

document
.getElementById("jobsButton")
.addEventListener(
  "click",
  showJobs
);


document
.getElementById("applicationsButton")
.addEventListener(
  "click",
  showApplications
);


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
  "input",
  loadJobs
);


locationInput.addEventListener(
  "change",
  loadJobs
);


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutButton")
.addEventListener(
  "click",
  function(){

    localStorage.removeItem(
      "kaamMileName"
    );

    localStorage.removeItem(
      "kaamMileMobile"
    );


    appPage.classList.add(
      "hidden"
    );

    loginPage.classList.remove(
      "hidden"
    );


    nameInput.value = "";

    mobileInput.value = "";

    searchInput.value = "";

    locationInput.value = "";


    alert(
      "आप Logout हो गए हैं।"
    );

  }
);


/* =========================
   AUTO LOGIN
========================= */

const savedName =
  localStorage.getItem(
    "kaamMileName"
  );

const savedMobile =
  localStorage.getItem(
    "kaamMileMobile"
  );


if(savedName && savedMobile){

  openApp();

}

</script>

</body>
</html>
